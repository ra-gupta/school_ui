# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  # Reminds about fees falling due in three days. The job dedupes per invoice
  # per person, so running it daily nags once rather than every morning.
  fee_reminders:
    class: Notifications::FeeReminderJob
    schedule: at 7am every day

  # A bus posting every few seconds writes thousands of rows a day; without
  # this vehicle_locations becomes the biggest table in the database in a term.
  prune_vehicle_locations:
    command: "Rake::Task['transport:prune_locations'].invoke"
    schedule: at 3am every day

  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
