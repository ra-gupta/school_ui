name: CI

on:
  pull_request:
  push:
    branches: [ main ]

# No scan_js job: this app pins no third-party JavaScript, so there is nothing
# for `importmap audit` to check.
jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      # No google-chrome-stable here on purpose. The runner image already ships
      # Chrome with the chromedriver that matches it; installing the apt package
      # upgrades Chrome past that driver and leaves Selenium driving a browser a
      # major version ahead of it, which drops clicks and typing rather than
      # failing outright.
      #
      # Google's apt source goes with it. This job installs nothing from it, but
      # apt-get update still reads it, and an index Google serves with a bad
      # hash fails the whole run. Matched on content rather than filename: the
      # runner image has used both google-chrome.list and the deb822
      # google-chrome.sources.
      - name: Install packages
        run: |
          grep -rl dl.google.com /etc/apt/ | sudo xargs -r rm -f
          sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git libpq-dev libyaml-dev pkg-config

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up the database configuration
        run: cp config/database.yml.ci config/database.yml

      # The system tests seed a full school and drive real screens, so they need
      # the schema loaded rather than fixtures alone.
      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
        run: bin/rails db:test:prepare test test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  # Reports what happened, once everything else has finished. Runs even when a
  # job fails — a silent failure is the one you find out about from a user.
  notify:
    needs: [ scan_ruby, lint, test ]
    if: always()
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Tell Slack
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          CHECKS: ${{ needs.scan_ruby.result }},${{ needs.lint.result }},${{ needs.test.result }}
          SUBJECT: ${{ github.event.head_commit.message || github.event.pull_request.title }}
          ACTOR: ${{ github.actor }}
          WORKFLOW: ${{ github.workflow }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "No SLACK_WEBHOOK_URL secret set - nothing to notify." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # A merge commit on main carries no pull_request payload, so the PR is
          # looked up from the commit. Failing that, the line is left out rather
          # than pointing at nothing.
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh api "repos/$GH_REPO/commits/$SHA/pulls" --jq '.[0].html_url' 2>/dev/null || true)
          fi

          if printf '%s' "$CHECKS" | grep -q failure; then
            icon=":x:"; colour="#c0392b"; status="CI failed"
          else
            icon=":white_check_mark:"; colour="#2eb886"; status="CI passed"
          fi

          # jq builds the JSON, so a quote or backtick in a commit message cannot
          # break the payload. The top-level "text" and the attachment's
          # "fallback" are what Slack shows in a push or desktop notification.
          jq -n \
            --arg subject "$(printf '%s' "$SUBJECT" | head -1)" \
            --arg actor "$ACTOR" \
            --arg icon "$icon" \
            --arg colour "$colour" \
            --arg workflow "$WORKFLOW" \
            --arg run_url "$RUN_URL" \
            --arg pr_url "$PR_URL" \
            --arg commit "${SHA:0:7}" \
            --arg commit_url "$REPO_URL/commit/$SHA" \
            --arg status "$status" \
            '($icon + " " + $status
              + (if $subject == "" then "" else ": " + $subject end)) as $summary
             | [
               ":bust_in_silhouette: *" + $actor + "*",
               $subject,
               $icon + " Run: <" + $run_url + "|" + $workflow + ">"
             ]
             + (if $pr_url == "" then [] else [ "Pull Request: " + $pr_url ] end)
             + [ "Commit: <" + $commit_url + "|" + $commit + ">" ]
             | { text: $summary, attachments: [ {
                 color: $colour,
                 fallback: $summary,
                 blocks: [ { type: "section", text: { type: "mrkdwn", text: join("\n") } } ]
               } ] }' \
            | curl -sS -X POST -H 'Content-type: application/json' --data @- "$WEBHOOK" > /dev/null

          echo "Posted to Slack." >> "$GITHUB_STEP_SUMMARY"
